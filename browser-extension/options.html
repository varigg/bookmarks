<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { max-width: 520px; padding: 16px; font: 14px system-ui, sans-serif; }
    label { display: block; margin-bottom: 6px; font-weight: 600; }
    input { width: 100%; padding: 6px 8px; box-sizing: border-box; }
    .help { margin: 6px 0 14px; color: #666; font-size: 13px; }
    button { padding: 8px 18px; font-weight: 600; background: #0060df; color: #fff;
             border: 0; border-radius: 4px; }
    #status { margin-top: 12px; }
    #status.error { color: #842029; font-weight: 700; }
  </style>
</head>
<body>
  <form id="options">
    <label for="serverUrl">Server address</label>
    <input type="url" id="serverUrl" placeholder="http://thunderbird:5000" required>
    <p class="help">Firefox will ask once for permission to send pages to this host.</p>
    <button type="submit">Save</button>
  </form>
  <p id="status"></p>
  <script src="server.js"></script>
  <script src="options.js"></script>
</body>
</html>
