<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 340px; padding: 14px; font: 13px system-ui, sans-serif; }
    #url { margin: 0 0 10px; color: #555; word-break: break-all; }
    label { display: block; margin-bottom: 4px; font-weight: 600; }
    textarea { width: 100%; min-height: 56px; box-sizing: border-box; resize: vertical; }
    button { width: 100%; margin-top: 10px; padding: 8px; font-weight: 600;
             background: #0060df; color: #fff; border: 0; border-radius: 4px; }
    button:disabled { background: #aaa; }
    #status { margin-top: 10px; padding: 8px; border-radius: 4px; display: none; }
    #status.saved { display: block; background: #d4edda; color: #155724; }
    #status.already_saved, #status.requeued { display: block; background: #fff3cd; color: #664d03; }
    #status.error { display: block; background: #f8d7da; color: #842029;
                    font-size: 15px; font-weight: 700; }
  </style>
</head>
<body>
  <p id="url"></p>
  <label for="note">Note (your own words, optional)</label>
  <textarea id="note" placeholder="Why are you keeping this?"></textarea>
  <button id="save">Save</button>
  <div id="status"></div>
  <script src="server.js"></script>
  <script src="popup.js"></script>
</body>
</html>
