<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 350px;
      padding: 15px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    h3 {
      margin-top: 0;
      font-size: 16px;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      margin-bottom: 4px;
      font-size: 13px;
      font-weight: 500;
    }
    input, textarea {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 13px;
      box-sizing: border-box;
    }
    textarea {
      min-height: 60px;
      resize: vertical;
    }
    button {
      width: 100%;
      padding: 8px;
      background: #0060df;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
      font-weight: 500;
    }
    button:hover {
      background: #0050c5;
    }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    .status {
      margin-top: 10px;
      padding: 8px;
      border-radius: 4px;
      font-size: 13px;
      display: none;
    }
    .status.success {
      background: #d4edda;
      color: #155724;
      display: block;
    }
    .status.error {
      background: #f8d7da;
      color: #721c24;
      display: block;
    }
    .configure-link {
      display: block;
      margin-top: 10px;
      text-align: center;
      font-size: 12px;
      color: #0060df;
      text-decoration: none;
    }
    .configure-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h3>Add Bookmark</h3>
  
  <form id="bookmarkForm">
    <div class="form-group">
      <label for="url">URL</label>
      <input type="text" id="url" readonly>
    </div>
    
    <div class="form-group">
      <label for="title">Title</label>
      <input type="text" id="title" readonly>
    </div>
    
    <button type="submit" id="submitBtn">Add Bookmark</button>
  </form>
  
  <div id="status" class="status"></div>
  
  <a href="#" id="configureLink" class="configure-link">Configure Server URL</a>
  
  <script src="popup.js"></script>
</body>
</html>
