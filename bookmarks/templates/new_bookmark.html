<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Bookmark</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>

<body>
    <div class="container">
        <h2>Add New Bookmark</h2>
        
        <!-- Flash messages -->
        <div class="flash-messages">
            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            <ul class="flashes">
                {% for category, message in messages %}
                <li class="flash {{ category }}">{{ message }}</li>
                {% endfor %}
            </ul>
            {% endif %}
            {% endwith %}
        </div>
        
        <form action="{{ url_for('main.new_bookmark') }}" method="POST">
            <div class="form-group">
                <label for="url">URL</label>
                <input type="url" id="url" name="url" value="{{ url or '' }}" required>
            </div>
            <div class="form-group">
                <label for="title">Title</label>
                <input type="text" id="title" name="title" value="{{ title or '' }}" required>
            </div>
            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" name="description" required>{{ description or '' }}</textarea>
            </div>
            <div class="form-group">
                <label for="tags">Tags (comma-separated)</label>
                <input type="text" id="tags" name="tags" value="{{ tags or '' }}">
            </div>
            <div class="form-group">
                <button type="submit">Add Bookmark</button>
            </div>
        </form>
        <a href="{{ url_for('main.bookmarks') }}" class="back-link">← Back to Bookmarks</a>
    </div>
</body>

</html>
