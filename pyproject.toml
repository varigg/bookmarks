[project]
name = "bookmarks"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.13.2",
    "asyncio>=4.0.0",
    "bs4>=0.0.2",
    "flask>=3.1.1",
    "flask-cors>=5.0.0",
    "flask-wtf>=1.2.1",
    "javascript-data-files>=1.3.0",
    "markitdown>=0.1.3",
    "mcp>=1.22.0",
    "pydantic>=2.5.0",
    "pytest-cov>=7.0.0",
    "requests>=2.32.5",
    "ruff>=0.14.6",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["bookmarks*"]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
