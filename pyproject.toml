[project]
name = "bookmarks"
version = "0.1.0"
description = "Self-hosted bookmark manager with LLM-powered automatic title and description generation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.13.2",
    "asyncio>=4.0.0",
    "bs4>=0.0.2",
    "flask>=3.1.1",
    "flask-cors>=5.0.0",
    "flask-wtf>=1.2.1",
    "javascript-data-files>=1.3.0",
    "markitdown>=0.1.3",
    "mcp>=1.22.0",
    "pydantic>=2.5.0",
    "pytest-cov>=7.0.0",
    "requests>=2.32.5",
    "ruff>=0.14.6",
    "ty>=0.0.1a34",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["bookmarks*"]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pre-commit>=4.0.1",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.5.47",
]


[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# Ruff configuration
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Enable recommended rules
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "N815",   # mixedCase variable in class scope (dateAdded matches JS format)
]

[tool.ruff.lint.isort]
known-first-party = ["bookmarks"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
