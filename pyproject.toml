[project]
name = "bookmarks"
version = "0.2.0"
description = "Personal semantic recall store: save a URL, an LLM summarises it, an agent finds it again"
readme = "README.md"
authors = [
    { name = "Steffen Vulpius", email = "steffen.vulpius@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.4",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "mcp>=2.3.0,<3",
    "pydantic>=2.14.0",
    "sqlite-vec>=0.1.9",
    "trafilatura>=2.3.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
bookmarks = "bookmarks.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "ruff>=0.17.0,<0.18",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
