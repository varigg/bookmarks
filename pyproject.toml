[project]
name = "bookmarks"
version = "0.2.0"
description = "Personal semantic recall store: save a URL, an LLM summarises it, an agent finds it again"
readme = "README.md"
authors = [
    { name = "Steffen Vulpius", email = "steffen.vulpius@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "mcp>=1.28.1,<2",
    "pydantic>=2.10",
    "sqlite-vec>=0.1.6",
    "trafilatura>=2.0",
    "uvicorn>=0.34",
]

[project.scripts]
bookmarks = "bookmarks.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.14.6,<0.16",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
