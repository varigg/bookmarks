services:
  bookmarks:
    build: .
    image: bookmarks:local
    ports:
      - "5000:5000"
    environment:
      - BOOKMARKS_PORT=5000
      - BOOKMARKS_DATA_SOURCE=/data/bookmarks.js
      - BOOKMARKS_BACKUP_DIR=/data/backup
      # LLM API Keys (loaded from .env file)
      - PERPLEXITY_API_KEY=${PERPLEXITY_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    volumes:
      - bookmarks_data:/data
    restart: unless-stopped

volumes:
  bookmarks_data:
