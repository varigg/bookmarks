services:
  bookmarks:
    build: .
    image: bookmarks:local
    ports:
      - "5000:5000"
    environment:
      - BOOKMARKS_PORT=5000
      - BOOKMARKS_DATA_DIR=${BOOKMARKS_DATA_DIR:-/srv/bookmarks-data}
      - BOOKMARKS_DATA_SOURCE=bookmarks.js
      - BOOKMARKS_BACKUP_DIR=backup
      # LLM API Keys (loaded from .env file)
      - PERPLEXITY_API_KEY=${PERPLEXITY_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    volumes:
      - ${BOOKMARKS_DATA_DIR:-/srv/bookmarks-data}:${BOOKMARKS_DATA_DIR:-/srv/bookmarks-data}
    restart: unless-stopped
