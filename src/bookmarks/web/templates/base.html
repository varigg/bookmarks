<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Bookmarks{% endblock %}</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { max-width: 50rem; margin: 0 auto; padding: 1rem; line-height: 1.5; }
    a { color: inherit; }
    form.filters { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: 1rem; }
    form.filters input[name=q] { flex: 1 1 15rem; }
    ul.items { list-style: none; padding: 0; }
    ul.items li { padding: .5rem 0; border-bottom: 1px solid #8884; }
    .meta { font-size: .85em; opacity: .7; }
    dl { display: grid; grid-template-columns: max-content 1fr; gap: .25rem 1rem; }
    dt { font-weight: 600; }
    dd { margin: 0; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <header><a href="/"><strong>Bookmarks</strong></a></header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
